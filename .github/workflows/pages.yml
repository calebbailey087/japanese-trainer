name: Deploy Kana to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/kana-practice run typecheck
      - run: pnpm --filter @workspace/kana-practice run test
      - name: Build for repository subpath
        run: pnpm --filter @workspace/kana-practice run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          VITE_ROUTER_MODE: hash
      - uses: actions/upload-pages-artifact@v4
        with:
          path: artifacts/kana-practice/dist/public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
